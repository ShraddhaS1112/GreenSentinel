<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Green Sentinel - Digital Immune System for Indian Agriculture. Monitor your farm with satellite intelligence and AI-powered threat detection." />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Green Sentinel" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter font for clean UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Green Sentinel - Farm Protection System</title>

    <!-- Inline critical CSS for faster FCP -->
    <style>
      :root {
        --color-primary: #16a34a;
        --color-background: #f8fafc;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--color-background);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Loading screen */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #14532d 0%, #166534 50%, #15803d 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse 2s infinite;
      }

      .loading-text {
        color: white;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .loading-subtext {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 24px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen shown while app loads -->
    <div class="loading-screen" id="loading-screen">
      <svg class="loading-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="white" stroke-width="2" opacity="0.3"/>
        <path d="M50 15 L50 50 L75 75" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="8" fill="#22c55e"/>
        <path d="M30 60 Q40 40, 50 50 T70 40" stroke="#4ade80" stroke-width="2" fill="none"/>
        <circle cx="30" cy="70" r="4" fill="#86efac"/>
        <circle cx="70" cy="35" r="4" fill="#86efac"/>
      </svg>
      <div class="loading-text">Green Sentinel</div>
      <div class="loading-subtext">Protecting Indian Farms</div>
      <div class="loading-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide loading screen when app loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('loading-screen');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() {
              loader.remove();
            }, 300);
          }
        }, 500);
      });
    </script>

    <!-- Register service worker -->
    <noscript>
      <div style="padding: 20px; text-align: center; background: #fef3c7; color: #92400e;">
        JavaScript is required to use Green Sentinel. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
  </body>
</html>
