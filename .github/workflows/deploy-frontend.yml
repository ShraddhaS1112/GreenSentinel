name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload hashed assets (cache 1 year)
        working-directory: frontend
        run: |
          aws s3 sync dist/assets/ s3://green-sentinel-dev-frontend-938881281454/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload entry points (no cache)
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://green-sentinel-dev-frontend-938881281454/ \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E7IN6ZTW0EXV5 \
            --paths "/*" \
            --output text --query 'Invalidation.Id'
